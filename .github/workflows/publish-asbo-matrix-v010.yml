name: Publish ASBO Matrix v0.1.1

on:
  push:
    branches:
      - asbo-matrix
    paths:
      - '.seed-publish-asbo-matrix-v011b'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Matrix branch
        uses: actions/checkout@v5
        with:
          ref: asbo-matrix
          fetch-depth: 0

      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git diff --quiet origin/main -- latest.json

      - name: Apply editor group update
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Version: 0.1.0/Version: 0.1.1/' matrix/asbo-matrix/asbo-matrix.php
          sed -i "s/private const VERSION = '0.1.0';/private const VERSION = '0.1.1';/" matrix/asbo-matrix/asbo-matrix.php
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('matrix/asbo-matrix/block/block.json')
          data = json.loads(p.read_text())
          data['version'] = '0.1.1'
          data['category'] = 'all-star-embroidery'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          php -l matrix/asbo-matrix/asbo-matrix.php
          php -l matrix/asbo-matrix/block/editor.asset.php
          node --check matrix/asbo-matrix/assets/matrix.js
          node --check matrix/asbo-matrix/block/editor.js
          python3 -m json.tool matrix/asbo-matrix/block/block.json >/dev/null
          grep -q 'Version: 0.1.1' matrix/asbo-matrix/asbo-matrix.php
          grep -q "private const VERSION = '0.1.1'" matrix/asbo-matrix/asbo-matrix.php
          grep -q '"version": "0.1.1"' matrix/asbo-matrix/block/block.json
          grep -q '"category": "all-star-embroidery"' matrix/asbo-matrix/block/block.json
          ! grep -R -E "update_meta_data\(|set_regular_price\(|set_sale_price\(|wc_create_order\(|WC\(\)->cart->add_to_cart" matrix/asbo-matrix

      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matrix/asbo-matrix/asbo-matrix.php matrix/asbo-matrix/block/block.json
          git commit -m 'matrix: place block in All Star Embroidery group' || true
          git push origin HEAD:asbo-matrix

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asbo-matrix-build
          mkdir -p /tmp/asbo-matrix-build/asbo-matrix dist/matrix
          cp -R matrix/asbo-matrix/. /tmp/asbo-matrix-build/asbo-matrix/
          cd /tmp/asbo-matrix-build
          zip -qr "$GITHUB_WORKSPACE/dist/matrix/asbo-matrix-0.1.1.zip" asbo-matrix
          cd "$GITHUB_WORKSPACE"
          unzip -t dist/matrix/asbo-matrix-0.1.1.zip >/dev/null
          unzip -p dist/matrix/asbo-matrix-0.1.1.zip asbo-matrix/block/block.json | grep -q '"category": "all-star-embroidery"'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'EOF'
          # ASBO Matrix v0.1.1

          - Places the ASBO Matrix block inside the existing **All Star Embroidery** block group in the WordPress editor.
          - No pricing, cart, product, or production ASBO behavior changed.
          EOF
          if gh release view matrix-v0.1.1 --repo All-Star-Embroidery/asbo-releases >/dev/null 2>&1; then
            gh release upload matrix-v0.1.1 dist/matrix/asbo-matrix-0.1.1.zip --clobber --repo All-Star-Embroidery/asbo-releases
          else
            gh release create matrix-v0.1.1 dist/matrix/asbo-matrix-0.1.1.zip --repo All-Star-Embroidery/asbo-releases --target asbo-matrix --title 'ASBO Matrix v0.1.1' --notes-file /tmp/notes.md
          fi

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: asbo-matrix-0.1.1
          path: dist/matrix/asbo-matrix-0.1.1.zip
          if-no-files-found: error
          retention-days: 30

      - name: Final safety check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git diff --quiet origin/main -- latest.json
