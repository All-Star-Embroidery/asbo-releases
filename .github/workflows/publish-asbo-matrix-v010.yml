name: Publish ASBO Matrix v0.1.0

on:
  push:
    branches:
      - asbo-matrix
    paths:
      - '.seed-publish-asbo-matrix-v010'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Matrix branch
        uses: actions/checkout@v5
        with:
          ref: asbo-matrix
          fetch-depth: 0

      - name: Safety guard — production ASBO updater unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git diff --quiet origin/main -- latest.json; then
            echo 'ERROR: ASBO Matrix must not alter production ASBO latest.json.' >&2
            git diff origin/main -- latest.json
            exit 1
          fi

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          php -l matrix/asbo-matrix/asbo-matrix.php
          php -l matrix/asbo-matrix/block/editor.asset.php
          node --check matrix/asbo-matrix/assets/matrix.js
          node --check matrix/asbo-matrix/block/editor.js
          python3 -m json.tool matrix/asbo-matrix/block/block.json >/dev/null

          grep -q "Version: 0.1.0" matrix/asbo-matrix/asbo-matrix.php
          grep -q "'_asbo_pricing_matrix'" matrix/asbo-matrix/asbo-matrix.php
          grep -q "asbo_matrix_enabled" matrix/asbo-matrix/asbo-matrix.php
          grep -q "parent_product_id" matrix/asbo-matrix/asbo-matrix.php
          grep -q "showStitchAllowance" matrix/asbo-matrix/block/block.json
          grep -q '"full"' matrix/asbo-matrix/block/block.json

          # Companion plugin must never write product meta/prices or create orders.
          ! grep -R -E "update_meta_data\(|set_regular_price\(|set_sale_price\(|wc_create_order\(|WC\(\)->cart->add_to_cart" matrix/asbo-matrix

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asbo-matrix-build
          mkdir -p /tmp/asbo-matrix-build/asbo-matrix dist/matrix
          cp -R matrix/asbo-matrix/. /tmp/asbo-matrix-build/asbo-matrix/
          (
            cd /tmp/asbo-matrix-build
            zip -qr "$GITHUB_WORKSPACE/dist/matrix/asbo-matrix-0.1.0.zip" asbo-matrix
          )
          unzip -t dist/matrix/asbo-matrix-0.1.0.zip >/dev/null
          unzip -l dist/matrix/asbo-matrix-0.1.0.zip | grep -q 'asbo-matrix/asbo-matrix.php'
          unzip -p dist/matrix/asbo-matrix-0.1.0.zip asbo-matrix/asbo-matrix.php | grep -q 'Version: 0.1.0'
          sha256sum dist/matrix/asbo-matrix-0.1.0.zip

      - name: Write release notes
        shell: bash
        run: |
          cat > /tmp/asbo-matrix-notes.md <<'EOF'
          # ASBO Matrix v0.1.0

          Companion Gutenberg block for normal WooCommerce product templates.

          ## Behavior
          - Renders only when the current product has a valid `_asbo_pricing_matrix`.
          - Products without a matrix output nothing and retain native WooCommerce pricing.
          - Shows the branded **Per-piece pricing by quantity** table with WooCommerce Regular Price at 1+ and ASBO matrix prices at configured bulk thresholds.
          - Shows the **10K stitch allowance** when embroidery exists in the matrix.
          - Shows a decoration selector when multiple matrix rows exist.
          - Adds live active-tier highlighting based on the normal WooCommerce quantity field.
          - Supports normal, Wide and Full Gutenberg alignment plus spacing controls.

          ## Pricing integration
          - The block marks the normal WooCommerce add-to-cart form only when a valid matrix is rendered.
          - The plugin adds production-compatible `asbo` cart metadata.
          - The existing production ASBO pricing hook applies the exact same combined-quantity tier engine across variations and preserves WooCommerce Regular Price below the first bulk break.
          - No competing pricing engine is introduced.

          ## Safety
          - No product meta writes.
          - No product price writes.
          - No order creation.
          - Production ASBO `latest.json` is unchanged.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view matrix-v0.1.0 --repo All-Star-Embroidery/asbo-releases >/dev/null 2>&1; then
            gh release upload matrix-v0.1.0 dist/matrix/asbo-matrix-0.1.0.zip --clobber --repo All-Star-Embroidery/asbo-releases
          else
            gh release create matrix-v0.1.0 \
              dist/matrix/asbo-matrix-0.1.0.zip \
              --repo All-Star-Embroidery/asbo-releases \
              --target asbo-matrix \
              --title 'ASBO Matrix v0.1.0' \
              --notes-file /tmp/asbo-matrix-notes.md
          fi

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: asbo-matrix-0.1.0
          path: dist/matrix/asbo-matrix-0.1.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Final production safety check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git diff --quiet origin/main -- latest.json
          echo 'ASBO Matrix released; production ASBO latest.json remains untouched.'
