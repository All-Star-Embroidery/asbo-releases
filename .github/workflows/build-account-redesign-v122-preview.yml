name: Build ASBO 1.2.2 Account Redesign Preview

on:
  push:
    branches:
      - account-redesign-v1.2.2
    paths:
      - '.seed-account-redesign-v122-preview*'
      - 'staging/v1.2.2-preview/**'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v5
        with:
          ref: account-redesign-v1.2.2
          fetch-depth: 2

      - name: Download validated v1.2.1 release base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asbo-v121 /tmp/asbo-work
          mkdir -p /tmp/asbo-v121 /tmp/asbo-work
          gh release download v1.2.1 \
            --repo All-Star-Embroidery/asbo-releases \
            --pattern 'all-star-bulk-order-block-1.2.1.zip' \
            --dir /tmp/asbo-v121
          unzip -q /tmp/asbo-v121/all-star-bulk-order-block-1.2.1.zip -d /tmp/asbo-work
          test -f /tmp/asbo-work/all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php

      - name: Apply Crafted Commerce account redesign
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/asbo-work/all-star-bulk-order-block-v1.0.0
          python3 staging/v1.2.2-preview/apply_preview.py "$ROOT"
          python3 staging/v1.2.2-preview/apply_refinement.py "$ROOT"

      - name: Validate patched plugin
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/asbo-work/all-star-bulk-order-block-v1.0.0
          php -l "$ROOT/all-star-bulk-order-block.php"
          php -l "$ROOT/includes/class-asbo-account-experience.php"
          php -l "$ROOT/includes/class-asbo-artwork-review.php"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/asbo-work/all-star-bulk-order-block-v1.0.0')
          data = json.loads((root/'block'/'block.json').read_text())
          assert data['version'] == '1.2.2', data['version']
          account = (root/'includes'/'class-asbo-account-experience.php').read_text()
          assert 'ASBO 1.2.2 BRAND SYSTEM' in account
          assert 'ASBO 1.2.2 tablet refinement' in account
          assert 'asbo-artwork-has-attention' in account
          assert 'asbo-account-quick-card__notice' in account
          main = (root/'all-star-bulk-order-block.php').read_text()
          assert 'Version: 1.2.2' in main
          assert "private const VERSION = '1.2.2';" in main
          PY
          echo 'Validation passed.'

      - name: Build preview ZIP and release notes
        shell: bash
        run: |
          set -euo pipefail
          rm -f all-star-bulk-order-block-1.2.2.zip
          (
            cd /tmp/asbo-work
            zip -qr "$GITHUB_WORKSPACE/all-star-bulk-order-block-1.2.2.zip" all-star-bulk-order-block-v1.0.0
          )
          unzip -t all-star-bulk-order-block-1.2.2.zip >/dev/null
          unzip -l all-star-bulk-order-block-1.2.2.zip | grep -q 'all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php'
          unzip -p all-star-bulk-order-block-1.2.2.zip all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php | grep -q 'Version: 1.2.2'

          cat > RELEASE-1.2.2.md <<'EOF'
          # All Star Bulk Order Block v1.2.2 — Account Redesign Preview

          Brand-system and responsive redesign of the WooCommerce My Account + Artwork experience.

          ## Crafted Commerce design system
          - Uses the 2026 All Star Embroidery navy, Heritage Gold, Warm Cream, white, Steel Gray, and Utility Red system.
          - Replaces the previous HeroUI/SaaS visual language with production records, editorial rules, restrained labels, and deliberate whitespace.
          - Removes unnecessary floating cards, pill overload, heavy radius, and decorative shadows.

          ## Responsive account shell
          - Mobile uses a real Account menu disclosure rather than a horizontal tab strip.
          - Tablet gets a dedicated two-column rail + content layout.
          - Fixes the dashboard-only split rail by explicitly sizing the identity/navigation grid rows so the navy sidebar stays continuous on Dashboard, Orders, Artwork, and the other endpoints.
          - Mobile touch targets remain 44px+ and form fields 48px.

          ## Dashboard actions + artwork attention
          - Replaces the oversized 2x2 shortcut blocks with a tighter two-column account-action ledger on tablet/desktop and a compact one-column list on mobile.
          - Artwork navigation receives a small gold attention indicator whenever active artwork exists.
          - The Artwork dashboard shortcut carries the same attention indicator.

          ## Preserved functionality
          No Supplier Sync pricing, supplier cost fields, WooCommerce Regular Price rules, ASBO bulk tiers, cart totals, shipping, checkout, artwork storage/review persistence, order ownership/security, or customer authentication/endpoints changed.
          EOF

          sha256sum all-star-bulk-order-block-1.2.2.zip
          ls -lh all-star-bulk-order-block-1.2.2.zip

      - name: Upload installable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: asbo-1.2.2-account-redesign-preview
          path: all-star-bulk-order-block-1.2.2.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit preview package to preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-bulk-order-block-1.2.2.zip RELEASE-1.2.2.md
          git commit -m 'preview: rebuild ASBO 1.2.2 account refinements' || exit 0
          git push origin HEAD:account-redesign-v1.2.2
