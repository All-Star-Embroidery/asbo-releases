name: Seed ASBO v1.1.8 Once

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  seed:
    if: github.event.issue.title == 'SEED ASBO 1.1.8'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download trusted v1.1.7 package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/asbo-v1.1.7/all-star-bulk-order-block-1.1.7.zip' \
            -o /tmp/asbo-1.1.7.zip
          unzip -t /tmp/asbo-1.1.7.zip >/dev/null
          rm -rf /tmp/asbo118
          mkdir -p /tmp/asbo118
          unzip -q /tmp/asbo-1.1.7.zip -d /tmp/asbo118

      - name: Apply v1.1.8 tablet fix and updater migration
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN='/tmp/asbo118/all-star-bulk-order-block-v1.0.0'
          MAIN="$PLUGIN/all-star-bulk-order-block.php"
          BLOCK="$PLUGIN/block/block.json"
          README="$PLUGIN/README.txt"

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/asbo118/all-star-bulk-order-block-v1.0.0')
          main=root/'all-star-bulk-order-block.php'
          block=root/'block'/'block.json'
          readme=root/'README.txt'
          s=main.read_text()
          replacements=[
            (' * Version: 1.1.7',' * Version: 1.1.8'),
            ("    private const VERSION = '1.1.7';","    private const VERSION = '1.1.8';"),
            ('Update URI: https://github.com/rolejarczyk/ASE.SupplierSync-Releases/tree/main/asbo','Update URI: https://github.com/All-Star-Embroidery/asbo-releases'),
            ("private const UPDATE_MANIFEST_URL = 'https://raw.githubusercontent.com/rolejarczyk/ASE.SupplierSync-Releases/main/asbo/latest.json';","private const UPDATE_MANIFEST_URL = 'https://raw.githubusercontent.com/All-Star-Embroidery/asbo-releases/main/latest.json';"),
          ]
          for old,new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one marker: {old!r}; found {s.count(old)}')
              s=s.replace(old,new,1)

          css=r'''

/* v1.1.8 — keep the pricing matrix readable on tablets and phones. */
.asbo__table-scroll {
  max-width: 100%;
}

@media (max-width: 1100px) {
  .asbo__table-scroll {
    overflow-x: auto !important;
    overflow-y: hidden;
    padding-bottom: 4px;
    overscroll-behavior-inline: contain;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }

  .asbo__pricing-table {
    width: auto;
    min-width: 100% !important;
    table-layout: auto !important;
  }

  .asbo__pricing-table th,
  .asbo__pricing-table td {
    white-space: nowrap !important;
    font-variant-numeric: tabular-nums;
  }

  .asbo__pricing-table th:first-child,
  .asbo__pricing-table td:first-child {
    position: sticky;
    left: 0;
    z-index: 2;
    width: 132px !important;
    min-width: 132px;
    box-shadow: 1px 0 0 var(--asbo-border);
    overflow-wrap: normal !important;
  }

  .asbo__pricing-table th:not(:first-child),
  .asbo__pricing-table td:not(:first-child) {
    min-width: 70px;
  }

  .asbo__pricing-table thead th:first-child {
    z-index: 3;
    background: var(--asbo-surface);
  }

  .asbo__pricing-table tbody th:first-child,
  .asbo__pricing-table tbody td:first-child {
    background: #fff;
  }
}

@media (max-width: 767px) {
  .asbo__pricing-table th,
  .asbo__pricing-table td {
    padding-right: 7px;
    padding-left: 7px;
  }

  .asbo__pricing-table th:first-child,
  .asbo__pricing-table td:first-child {
    width: 122px !important;
    min-width: 122px;
  }

  .asbo__pricing-table th:not(:first-child),
  .asbo__pricing-table td:not(:first-child) {
    min-width: 64px;
  }
}
'''
          marker='\nCSS;\n    }\n\n    private static function inline_js'
          if s.count(marker) != 1:
              raise SystemExit('inline CSS marker not found exactly once')
          s=s.replace(marker,css+marker,1)
          main.write_text(s)

          b=block.read_text()
          if b.count('"version": "1.1.7"') != 1:
              raise SystemExit('block version marker missing')
          block.write_text(b.replace('"version": "1.1.7"','"version": "1.1.8"',1))

          r=readme.read_text()
          if 'All Star Bulk Order Block v1.1.7' in r:
              r=r.replace('All Star Bulk Order Block v1.1.7','All Star Bulk Order Block v1.1.8',1)
          r += '''\n\nv1.1.8 responsive pricing-matrix fix and updater migration:\n- Prevents pricing values from overlapping on tablet/mobile by preserving readable column widths and enabling controlled horizontal scrolling.\n- Keeps the Decoration method column visible while swiping quantity tiers.\n- Migrates the built-in updater to All-Star-Embroidery/asbo-releases.\n- No pricing values, discount tiers, Supplier Sync logic, cart, savings, artwork, or checkout behavior changed.\n'''
          readme.write_text(r)
          PY

          php -l "$MAIN"
          node --check "$PLUGIN/block/editor.js"
          python3 -m json.tool "$BLOCK" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/asbo118/all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php').read_text()
          marker="        return <<<'JS'\n"
          start=s.index(marker,s.index('private static function inline_js'))+len(marker)
          end=s.index('\nJS;',start)
          Path('/tmp/asbo-inline.js').write_text(s[start:end])
          PY
          node --check /tmp/asbo-inline.js
          grep -q 'Version: 1.1.8' "$MAIN"
          grep -q 'All-Star-Embroidery/asbo-releases/main/latest.json' "$MAIN"
          grep -q 'overflow-x: auto !important' "$MAIN"

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f all-star-bulk-order-block-1.1.8.zip
          ( cd /tmp/asbo118 && zip -qr "$GITHUB_WORKSPACE/all-star-bulk-order-block-1.1.8.zip" all-star-bulk-order-block-v1.0.0 )
          unzip -t all-star-bulk-order-block-1.1.8.zip >/dev/null
          unzip -l all-star-bulk-order-block-1.1.8.zip | grep -q 'all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php'
          sha256sum all-star-bulk-order-block-1.1.8.zip

      - name: Commit seeded ZIP to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-bulk-order-block-1.1.8.zip
          git commit -m 'release: seed ASBO v1.1.8 ZIP' || true
          git push

      - name: Create v1.1.8 GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view asbo-v1.1.8 >/dev/null 2>&1; then
            gh release upload asbo-v1.1.8 all-star-bulk-order-block-1.1.8.zip --clobber
            gh release edit asbo-v1.1.8 --title 'All Star Bulk Order Block v1.1.8' --notes-file RELEASE-1.1.8.md
          else
            gh release create asbo-v1.1.8 all-star-bulk-order-block-1.1.8.zip --target main --title 'All Star Bulk Order Block v1.1.8' --notes-file RELEASE-1.1.8.md
          fi

      - name: Point latest.json at Release asset
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('latest.json')
          d=json.loads(p.read_text())
          d['version']='1.1.8'
          d['download_url']='https://github.com/All-Star-Embroidery/asbo-releases/releases/download/asbo-v1.1.8/all-star-bulk-order-block-1.1.8.zip'
          d['homepage']='https://github.com/All-Star-Embroidery/asbo-releases'
          d['last_updated']=datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git add latest.json
          git commit -m 'release: point ASBO updater to v1.1.8 Release asset' || true
          git push
