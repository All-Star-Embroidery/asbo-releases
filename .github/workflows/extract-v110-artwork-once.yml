name: Extract ASBO v1.1.10 Artwork Source Once

on:
  push:
    branches:
      - main
    paths:
      - .extract-v110-artwork

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Extract published v1.1.10 artwork source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://github.com/All-Star-Embroidery/asbo-releases/releases/download/asbo-v1.1.10/all-star-bulk-order-block-1.1.10.zip' \
            -o /tmp/base.zip
          unzip -t /tmp/base.zip >/dev/null
          rm -rf /tmp/base110
          mkdir -p /tmp/base110
          unzip -q /tmp/base.zip -d /tmp/base110
          cp /tmp/base110/all-star-bulk-order-block-v1.0.0/includes/class-asbo-artwork-review.php staging/v1.2.0/base-artwork-v1.1.10.php
          php -l staging/v1.2.0/base-artwork-v1.1.10.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging/v1.2.0/base-artwork-v1.1.10.php
          git commit -m 'staging: capture published ASBO v1.1.10 artwork source'
          git push
